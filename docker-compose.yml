services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/studDB
      CORS_ORIGINS: http://localhost:8080
    depends_on: [mongodb]
    ports: ["5000:5000"]
  frontend:
    build: ./frontend-react
    depends_on: [backend]
    ports: ["8080:80"]
volumes:
  mongo-data:
