# Local development: MongoDB only. The app itself runs with `npm run dev`
# (http://localhost:13000). Start the database with:
#
#   docker compose up -d        (or: npm run db:up)
#
# Matches MONGODB_URI=mongodb://localhost:27017/studDB in backend/.env.example.
# Data persists in the "mongo-data" volume; `docker compose down -v` wipes it.
services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongo-data:
