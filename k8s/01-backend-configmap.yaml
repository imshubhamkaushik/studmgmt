apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: studmgmt
data:
  NODE_ENV: "production"
  PORT: "5000"
  # Set to your real domain(s) once the Ingress hostname is known — the
  # frontend calls the API directly by URL, not through the same origin.
  CORS_ORIGINS: "https://studmgmt.example.com"
  JWT_ACCESS_TTL_SECONDS: "900"
  JWT_REFRESH_TTL_DAYS: "7"
  PORTAL_ACCESS_TTL_SECONDS: "900"
  PORTAL_REFRESH_TTL_DAYS: "7"
  RATE_LIMIT_MAX: "120"
  ADMIN_NAME: "Administrator"
  ADMIN_EMAIL: "admin@studmgmt.example.com"
  # From terraform output ecr... no — from the S3 bucket name / DynamoDB
  # table name Terraform created in csv-import.tf, needed by
  # /api/v1/students/import-jobs/:jobId to look up job status and presign
  # the error report download.
  IMPORTS_BUCKET: "studmgmt-imports-<ACCOUNT_ID>"
  JOBS_TABLE: "studmgmt-import-jobs"
  # From terraform output submissions_bucket_name — needed by the
  # assignment-submission upload-url and download endpoints.
  SUBMISSIONS_BUCKET: "studmgmt-submissions-<ACCOUNT_ID>"
  OTEL_SERVICE_NAME: "studmgmt-backend"
