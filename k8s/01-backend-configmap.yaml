apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: studmgmt
data:
  NODE_ENV: "production"
  PORT: "5000"
  # Set to your real domain(s) once the Ingress hostname is known — the
  # frontend calls the API directly by URL, not through the same origin.
  CORS_ORIGINS: "https://studmgmt.example.com"
  JWT_ACCESS_TTL_SECONDS: "900"
  JWT_REFRESH_TTL_DAYS: "7"
  PORTAL_ACCESS_TTL_SECONDS: "900"
  PORTAL_REFRESH_TTL_DAYS: "7"
  RATE_LIMIT_MAX: "120"
  ADMIN_NAME: "Administrator"
  ADMIN_EMAIL: "admin@studmgmt.example.com"
  # From terraform output ecr... no — from the S3 bucket name / DynamoDB
  # table name Terraform created in csv-import.tf, needed by
  # /api/v1/students/import-jobs/:jobId to look up job status and presign
  # the error report download.
  IMPORTS_BUCKET: "studmgmt-imports-<ACCOUNT_ID>"
  JOBS_TABLE: "studmgmt-import-jobs"
  # From terraform output submissions_bucket_name — needed by the
  # assignment-submission upload-url and download endpoints. Assignment
  # attachments now use the same physical bucket under an "assignments/"
  # prefix (see terraform/assignment-submissions.tf's backend IAM policy)
  # — kept as its own env var, rather than reusing SUBMISSIONS_BUCKET
  # directly in code, so each feature's config is self-documenting and the
  # two can point at different buckets later without a code change.
  SUBMISSIONS_BUCKET: "studmgmt-submissions-<ACCOUNT_ID>"
  ASSIGNMENTS_BUCKET: "studmgmt-submissions-<ACCOUNT_ID>"
  # Generated report-card PDFs are still local-disk-backed (the
  # backend-uploads PVC), not S3 — see report-card.service.js for why.
  # REPORT_CARDS_BUCKET is not yet read anywhere; left unset intentionally
  # until that migration happens.
  OTEL_SERVICE_NAME: "studmgmt-backend"
