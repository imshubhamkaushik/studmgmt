# Recommended over 02-backend-secret.example.yaml for any real deployment.
# Requires the External Secrets Operator installed on the cluster (not
# included here — install via its Helm chart) and the IRSA role from
# terraform/iam.tf, which grants read access to exactly these Secrets
# Manager entries and nothing else.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: studmgmt
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1 # match terraform/variables.tf's aws_region
      auth:
        jwt:
          serviceAccountRef:
            name: backend-service-account
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secret
  namespace: studmgmt
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: backend-secret # same Secret name the Deployment already references
    creationPolicy: Owner
  data:
    - secretKey: MONGODB_URI
      remoteRef:
        key: studmgmt/documentdb-connection-string
    - secretKey: JWT_SECRET
      remoteRef:
        key: studmgmt/jwt-secret
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: studmgmt/admin-bootstrap-password
    - secretKey: REDIS_URL
      remoteRef:
        key: studmgmt/redis-connection-string
