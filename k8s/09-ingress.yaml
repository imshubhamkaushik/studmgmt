# Requires the AWS Load Balancer Controller running on the cluster (not
# included here — install via its Helm chart once terraform/eks.tf and
# terraform/iam.tf are applied; it needs its own IRSA role with ALB
# permissions). Without it, this Ingress will sit with no address.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studmgmt
  namespace: studmgmt
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # ACM certificate for your domain — created outside this repo (ACM
    # console or a small terraform/acm.tf), referenced here by ARN.
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:<ACCOUNT_ID>:certificate/<CERT_ID>"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 80 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
