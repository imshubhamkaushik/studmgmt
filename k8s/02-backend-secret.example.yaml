# TEMPLATE ONLY — do not commit this file with real values filled in, and
# do not `kubectl apply` it as-is in production. This exists so you can see
# the exact shape of what the backend needs. For a real cluster, use
# 02b-backend-externalsecret.yaml instead, which pulls these same keys from
# AWS Secrets Manager via IRSA — nothing sensitive ever lives in git or in
# a manifest at all.
#
# stringData (not data) is used here so values are plain text in this
# template rather than pre-base64-encoded — Kubernetes encodes them itself
# on apply.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: studmgmt
type: Opaque
stringData:
  # DocumentDB requires TLS — the CA bundle is already baked into the
  # image at /app/certs/global-bundle.pem (see backend/Dockerfile).
  # replicaSet=rs0 and retryWrites=false are DocumentDB-specific;
  # a stock MongoDB replica set would use different values here.
  MONGODB_URI: "mongodb://CHANGE_ME:CHANGE_ME@<docdb-cluster-endpoint>:27017/studDB?tls=true&tlsCAFile=/app/certs/global-bundle.pem&replicaSet=rs0&readPreference=secondaryPreferred&retryWrites=false"
  JWT_SECRET: "CHANGE_ME_AT_LEAST_32_RANDOM_CHARACTERS"
  ADMIN_PASSWORD: "CHANGE_ME"
  REDIS_URL: "redis://<elasticache-primary-endpoint>:6379/0"
