apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-archive-worker-service-account
  namespace: studmgmt
  annotations:
    # From terraform output audit_archive_worker_irsa_role_arn — the only
    # role in this repo with no Secrets Manager access at all, since this
    # worker never touches MongoDB (see terraform/audit-pipeline.tf).
    eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/studmgmt-audit-archive-worker-irsa"
