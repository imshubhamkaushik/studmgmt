# Same image as the backend API and the other workers, different command.
# Unlike import-worker and submission-worker, no secretRef here at all —
# this is the one workload in the repo that never calls connectDatabase(),
# so there's no MONGODB_URI (or anything else) it needs from backend-secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-archive-worker
  namespace: studmgmt
spec:
  # Scales freely — each replica batches whatever messages it happens to
  # receive and writes its own uniquely-named S3 object, no shared state
  # or coordination needed between replicas.
  replicas: 2
  selector:
    matchLabels: { app: audit-archive-worker }
  template:
    metadata:
      labels: { app: audit-archive-worker }
    spec:
      serviceAccountName: audit-archive-worker-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: audit-archive-worker
          image: REPLACE_WITH_ECR_BACKEND_IMAGE:TAG # same image as k8s/04-backend-deployment.yaml
          command: ["node", "--import", "./src/telemetry.js", "src/workers/audit-archive-worker.js"]
          envFrom:
            - configMapRef: { name: audit-archive-worker-config }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
      volumes:
        - name: tmp
          emptyDir: {}
