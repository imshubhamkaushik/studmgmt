apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-archive-worker-config
  namespace: studmgmt
data:
  NODE_ENV: "production"
  # From terraform outputs audit_archive_queue_url / audit_archive_bucket_name.
  AUDIT_ARCHIVE_QUEUE_URL: "https://sqs.<region>.amazonaws.com/<account_id>/studmgmt-audit-archive-queue"
  AUDIT_ARCHIVE_BUCKET: "studmgmt-audit-archive-<account_id>"
  OTEL_SERVICE_NAME: "studmgmt-audit-archive-worker"
