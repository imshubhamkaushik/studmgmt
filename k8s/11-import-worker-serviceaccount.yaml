apiVersion: v1
kind: ServiceAccount
metadata:
  name: import-worker-service-account
  namespace: studmgmt
  annotations:
    # From terraform output import_worker_irsa_role_arn. Deliberately a
    # different role than backend-service-account uses — see the comment
    # on aws_iam_role.import_worker in terraform/iam.tf for why.
    eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/studmgmt-import-worker-irsa"
