# Same image as the backend API Deployment and import-worker, different
# command — see the comment on k8s/12-import-worker-deployment.yaml for
# why this isn't a separate image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: submission-worker
  namespace: studmgmt
spec:
  # Scales freely, same reasoning as import-worker: no PVC, and multiple
  # replicas safely share one SQS queue.
  replicas: 2
  selector:
    matchLabels: { app: submission-worker }
  template:
    metadata:
      labels: { app: submission-worker }
    spec:
      serviceAccountName: submission-worker-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: submission-worker
          image: REPLACE_WITH_ECR_BACKEND_IMAGE:TAG # same image as k8s/04-backend-deployment.yaml
          command: ["node", "--import", "./src/telemetry.js", "src/workers/submission-consumer.js"]
          envFrom:
            - configMapRef: { name: submission-worker-config }
            - secretRef: { name: backend-secret } # only MONGODB_URI is actually read — see terraform/assignment-submissions.tf
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
      volumes:
        - name: tmp
          emptyDir: {}
