apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: studmgmt
spec:
  # Pinned to 1 for the reason documented on the PVC: the uploads volume is
  # ReadWriteOnce, so a second replica can't reliably mount it. Revisit
  # once report cards / submissions move to S3.
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      serviceAccountName: backend-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the `node` user baked into the node:22-alpine image
        fsGroup: 1000
      containers:
        - name: backend
          # Replaced by CI with the real ECR image + tag on each deploy
          # (see .github/workflows/deploy.yml) — this placeholder is never
          # applied as-is.
          image: REPLACE_WITH_ECR_BACKEND_IMAGE:TAG
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: backend-secret }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /api/v1/ready, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 5000 }
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: backend-uploads }
        - name: tmp
          emptyDir: {}
