# ReadWriteOnce because it's backed by EBS via the gp3 StorageClass — one
# node can attach it at a time. That's why the backend Deployment below is
# pinned to a single replica for now: EFS (ReadWriteMany) would remove
# that ceiling, but adding it before it's needed is premature complexity.
#
# Assignment attachments and staff-recorded submissions have already
# moved to S3 (see backend/src/utils/s3-storage.js) and no longer touch
# this volume. Generated report-card PDFs are the one thing still here —
# deliberately not migrated yet because the integration test covering
# them (report-card-auto-generate.integration.test.js) asserts a full
# generate-then-download round trip, and this project's CI has no
# S3/LocalStack mock to satisfy that without hitting real AWS. Once CI
# has one, report cards can move too and this PVC can be deleted outright.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-uploads
  namespace: studmgmt
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 1Gi
