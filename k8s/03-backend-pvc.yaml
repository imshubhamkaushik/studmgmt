# ReadWriteOnce because it's backed by EBS via the gp3 StorageClass — one
# node can attach it at a time. That's why the backend Deployment below is
# pinned to a single replica for now: EFS (ReadWriteMany) would remove
# that ceiling, but adding it before it's needed is premature complexity.
# Moving assignment submissions / report cards to S3 (already planned)
# removes the need for this volume entirely.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-uploads
  namespace: studmgmt
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 5Gi
