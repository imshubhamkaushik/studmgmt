apiVersion: v1
kind: ServiceAccount
metadata:
  name: submission-worker-service-account
  namespace: studmgmt
  annotations:
    # From terraform output submission_worker_irsa_role_arn — a separate
    # role from both the API server's and the import-worker's, scoped to
    # exactly this one queue plus the two secrets this worker needs
    # (JWT_SECRET, MONGODB_URI). See terraform/assignment-submissions.tf.
    eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/studmgmt-submission-worker-irsa"
