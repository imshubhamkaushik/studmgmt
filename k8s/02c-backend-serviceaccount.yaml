apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-service-account
  namespace: studmgmt
  annotations:
    # Replace with the eks_backend_role_arn output from terraform/outputs.tf
    # once you've run `terraform apply`. This is what lets the pod read
    # from Secrets Manager (via ExternalSecret) without any AWS credentials
    # baked into the image or passed as env vars.
    eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/studmgmt-backend-irsa"
